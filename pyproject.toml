[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-gnome"
version = "0.1.0"
description = "GNOME WhisperX frontend"
authors = [{name = "Pau Iranzo"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dateutil>=2.8",
]

[project.scripts]
whisper-gnome = "whisper_gnome.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["whisper_gnome", "whisper_gnome.utils"]
include-package-data = true
